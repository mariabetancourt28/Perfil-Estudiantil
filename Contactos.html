<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f2f2f2; color: #333; }
    header, footer { padding: 18px; background: #24574b; color: white; text-align: center; }
    nav a { margin: 0 10px; color: white; text-decoration: none; }
    main { min-height: 70vh; padding: 25px 15px; }
    .formulario { max-width: 400px; margin: 20px auto; padding: 20px; background: white; }
    label, input, textarea { display: block; width: 100%; margin: 8px 0; box-sizing: border-box; }
    input, textarea { padding: 8px; }
    textarea { height: 100px; }
    button { padding: 9px 16px; background: #f4c84a; border: 0; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>Mi página de contacto</h1>
    <nav>
      <a href="Tarea 4 11-2.html">Inicio</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>

  <main id="inicio">
    <section class="formulario" id="contacto">
      <h2>Contáctame</h2>
      <p>Completa el formulario y me pondré en contacto contigo.</p>
      <form>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>

        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" placeholder="Tu número de teléfono">

        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje..." required></textarea>

        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Gracias por visitar mi página</p>
  </footer>
</body>
</html>
